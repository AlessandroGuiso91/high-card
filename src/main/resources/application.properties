spring.application.name=demo

# JWT — configuration
app.jwt.issuer=high-card
app.jwt.audience=high-card-api
app.jwt.expiration-minutes=60
app.jwt.public-key-location=classpath:keys/public.pem
app.jwt.private-key-location=classpath:keys/private.pem

# Swagger / OpenAPI — UI at /swagger-ui.html, raw JSON at /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha